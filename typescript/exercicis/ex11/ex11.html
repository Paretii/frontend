<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="ex11.css">
    <script type="module" src="ex11.js"></script>
</head>
<body>
<h1>Sistema de Pestanyes (Tabs)</h1>
<div id="divBtns" class="divBtns">
    <button data-tab="uno" class="tab-btn active">Pestanya 1</button>
    <button data-tab="dos" class="tab-btn">Pestanya 2</button>
    <button data-tab="tres" class="tab-btn">Pestanya 3</button>
</div>
<br>
<div>
    <div class="tab-content active" id="uno">
        <h1>Contingut 1</h1>
        <p>Aquest es el contingut de la primera pestanya</p></div>
    <div class="tab-content" id="dos">
        <h1>Contingut 2</h1>
        <p>Aquest es el contingut de la segona pestanya</p></div>
    <div class="tab-content" id="tres">
        <h1>Contingut 3</h1>
        <p>Aquest es el contingut de la tercera pestanya</p>
    </div>
</div>
</body>
</html>
